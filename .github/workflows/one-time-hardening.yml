name: One-time production hardening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtime-production-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply hardening
        run: |
          node scripts/harden-legacy3.mjs
          node scripts/fix-index-syntax.mjs
      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server/executionOrchestrator.ts server/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: apply production hardening"
          git fetch origin realtime-production-upgrade
          git rebase origin/realtime-production-upgrade
          git push origin HEAD:realtime-production-upgrade
