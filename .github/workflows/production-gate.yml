name: Production Readiness Gate

on:
  push:
    branches: [main, realtime-production-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Backend typecheck
        run: npm run typecheck:backend
      - name: Frontend production build
        run: npm run build
      - name: Python syntax checks
        run: |
          python3 -m py_compile backend/server/parse_hardware.py
          python3 -m py_compile backend/server/advanced_ocr.py
          python3 -m py_compile backend/server/schematic_preprocessor.py
      - name: Fabrication/default audit
        run: npm run production:audit
