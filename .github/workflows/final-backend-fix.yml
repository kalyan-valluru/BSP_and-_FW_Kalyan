name: Backend hardening check

on:
  push:
    branches: [realtime-production-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Backend typecheck
        run: npm run typecheck:backend
      - name: Production audit
        run: npm run production:audit
