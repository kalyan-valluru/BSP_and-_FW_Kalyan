name: Backend hardening repair

on:
  push:
    branches: [realtime-production-upgrade]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'kalyan-valluru'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: realtime-production-upgrade
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair backend syntax once
        run: node scripts/fix-index-syntax.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts
          if git diff --cached --quiet; then
            echo "No repair required."
            exit 0
          fi
          git commit -m "fix: repair backend index syntax"
          git fetch origin realtime-production-upgrade
          git rebase origin/realtime-production-upgrade
          git push origin HEAD:realtime-production-upgrade
